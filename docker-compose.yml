services:
  nextjs:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nextjs-app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/usr/src/app
    environment:
      - NODE_ENV=development
    depends_on:
      - laravel

  laravel:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laravel-app
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    secrets:
      - pgsql_user
      - pgsql_password
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=adriaestevezdb
      - DB_USERNAME_FILE=/run/secrets/pgsql_user
      - DB_PASSWORD_FILE=/run/secrets/pgsql_password
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: postgres-db
    ports:
      - "5432:5432"
    secrets:
      - pgsql_user
      - pgsql_password
    environment:
      POSTGRES_USER_FILE: /run/secrets/pgsql_user
      POSTGRES_PASSWORD_FILE: /run/secrets/pgsql_password
      POSTGRES_DB: adriaestevezdb
    volumes:
      - db_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: adminer
    restart: always
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_DB_DRIVER: pgsql
    depends_on:
      - db

volumes:
  db_data:

secrets:
  pgsql_user:
    file: ./docker-secrets/pgsql_user
  pgsql_password:
    file: ./docker-secrets/pgsql_password
